<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07162f">
  <meta name="description" content="Explore NASA Astronomy Picture of the Day images.">
  <title>NASA Space Explorer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/nasa-worm-logo.png">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA" class="logo">
      <div>
        <p class="eyebrow">NASA · Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <main>
      <section class="filters" aria-label="Date range">
        <label>
          <span>Start date</span>
          <input type="date" id="startDate">
        </label>
        <label>
          <span>End date</span>
          <input type="date" id="endDate">
        </label>
        <button id="getImagesBtn" type="button">Explore the cosmos</button>
      </section>

      <div id="gallery" class="gallery" aria-live="polite">
        <div class="placeholder">
          <div class="placeholder-icon" aria-hidden="true">🔭</div>
          <p>Select a date range and explore the cosmos.</p>
        </div>
      </div>
    </main>

    <section class="pwa-controls" aria-label="App controls">
      <button id="installButton" type="button" hidden>Install NASA Explorer</button>
      <button id="notificationButton" type="button">Enable Notifications</button>
    </section>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Space image details">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close modal">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="install-banner" class="install-banner hidden" role="status">
    <span>Install NASA Explorer for quick access.</span>
    <button id="install-yes" class="install-yes" type="button">Install</button>
    <button id="install-dismiss" class="install-dismiss" type="button">Not now</button>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
